<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VISA VISTA | Admin</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f2f7fb;
      color: #173b5d;
      font-family: Arial, sans-serif;
    }

    .admin-wrap {
      max-width: 900px;
      margin: 38px auto;
      padding: 18px;
    }

    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 8px 28px #163c5b15;
      margin: 18px 0;
    }

    .field {
      display: block;
      margin: 13px 0;
      font-weight: 600;
    }

    .field input,
    .field textarea,
    .field select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #cbd8e4;
      border-radius: 8px;
      margin-top: 6px;
      font: inherit;
    }

    .btn {
      background: #087fbd;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      margin: 4px;
    }

    .btn.danger {
      background: #b83b45;
    }

    .btn.secondary {
      background: #60758a;
    }

    .hidden {
      display: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #e4ebf1;
      padding: 14px 0;
      flex-wrap: wrap;
    }

    .muted {
      color: #60758a;
      line-height: 1.5;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #eaf5fb;
      margin: 12px 0;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

  <main class="admin-wrap">

    <div class="top">
      <h1>VISA VISTA – Admin Portal</h1>
      <a href="success-stories.html">View Success Stories</a>
    </div>

    <!-- Login Section -->
    <section class="panel" id="loginBox">
      <h2>Secure Admin Login</h2>

      <label class="field">
        Password
        <input
          id="password"
          type="password"
          autocomplete="current-password"
        >
      </label>

      <button class="btn" id="loginBtn" type="button">
        Login
      </button>

      <p id="loginError" role="alert"></p>
    </section>

    <!-- Admin Dashboard -->
    <section class="panel hidden" id="dashboard">

      <div class="top">
        <h2>Manage Success Stories</h2>

        <button class="btn" id="logoutBtn" type="button">
          Logout
        </button>
      </div>

      <div class="status" id="status">
        Manage your published success stories here.
      </div>

      <!-- Add / Edit Story Form -->
      <form id="storyForm">

        <label class="field">
          Title (optional)
          <input id="title" maxlength="100">
        </label>

        <label class="field">
          Visa category (optional)
          <select id="category">
            <option value="">Choose category</option>
            <option>Visit Visa</option>
            <option>Study Visa</option>
            <option>Group Tours</option>
            <option>IELTS</option>
            <option>Other</option>
          </select>
        </label>

        <label class="field">
          Country (optional)
          <input id="country">
        </label>

        <label class="field">
          Date (optional)
          <input id="date" type="date">
        </label>

        <label class="field">
          Story (optional)
          <textarea id="story" rows="4" maxlength="1500"></textarea>
        </label>

        <label class="field">
          Photo (optional)
          <input
            id="image"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >
        </label>

        <label class="field">
          Video (optional)
          <input
            id="video"
            type="file"
            accept="video/mp4,video/webm"
          >
        </label>

        <p class="muted">
          Photo max 12 MB; video max 35 MB.
          Upload only with the client's permission.
        </p>

        <button class="btn" type="submit">
          Publish Story
        </button>

        <button
          class="btn secondary hidden"
          id="cancelEdit"
          type="button"
        >
          Cancel Edit
        </button>

      </form>

      <!-- Published Stories -->
      <h2>Published Stories</h2>

      <div id="storyList"></div>

    </section>

  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
